 <button class="btn pri" style="width:100%" ${ci?"disabled":""} onclick="checkin()">${ci?"✔ Checked in today":"Check in to today's session (+5 XP)"}</button></div>
 <div class="card"><div class="sec">Avatar</div><div class="avs">${AVS.map(a=>`<span class="${a===me.avatar?"on":""}" onclick="setAv(${q(a)})">${a}</span>`).join("")}</div></div>
 <div class="card"><div class="sec">Rewards</div>${BADGES.map(b=>`<span class="badge ${me.xp>=b[1]?"":"off"}">${b[0]} (${b[1]})</span>`).join("")}<br>${[["🔥 3 Sessions",me.checkins.length>=3],["🧩 5 Puzzles",me.solved.length>=5],["📅 10 Sessions",me.checkins.length>=10],["💎 Expert Solver",SEED.some(p=>lvl(p)===4&&me.solved.includes(p.id))],["👑 Master Solver",SEED.some(p=>lvl(p)===5&&me.solved.includes(p.id))],["⚔️ First Win",me.won.length>=1]].map(x=>`<span class="badge ${x[1]?"":"off"}">${x[0]}</span>`).join("")}</div>`}
function checkin(){if(!me.checkins.includes(today())){me.checkins.push(today());me.xp+=5;save();
 if(db)db.doc("attendance/"+today()+"_"+uid).set({uid,name:me.name||"Member",date:today()}).catch(()=>{});render()}}
function taskTab(){return `<div class="card"><div class="sec">🎯 Club Tasks</div><div class="mut">Complete challenges for bonus XP</div>${tasks.length?tasks.map(t=>{const d=me.tasks.includes(t._id),x=Math.max(0,+t.xp||0);return `<div class="row"><span>${d?"✅":"⬜"} ${esc(t.title)} <b class="ok">+${x} XP</b></span>${d?"":`<button class="btn sm" onclick="doTask(${q(t._id)},${x})">Done</button>`}</div>`}).join(""):"<p class='mut'>No tasks yet — officers can add some.</p>"}</div>`}
function doTask(id,x){if(!hasP())return go("profile");if(!me.tasks.includes(id)){me.tasks.push(id);me.xp+=x;save();render()}}
function board_(){const arr=players.filter(p=>p.uid!==uid);if(hasP())arr.push(Object.assign({},me,{uid}));
 const l=arr.sort((a,b)=>(b.xp||0)-(a.xp||0)).slice(0,30),med=["🥇","🥈","🥉"];
 return `<div class="card"><div class="sec">🏆 Leaderboard</div>${db?"":'<p class="mut">Only you are shown in guest mode.</p>'}<table><tr><th>#</th><th>Player</th><th>XP</th><th>Solved</th></tr>${l.map((p,i)=>`<tr class="${p.uid===uid?"me":""}"><td class="n">${med[i]||i+1}</td><td>${esc(p.avatar||"♞")} ${esc(p.name||"Member")}</td><td>${p.xp||0}</td><td>${(p.solved||[]).length}</td></tr>`).join("")||"<tr><td colspan=4 class=mut>Nobody yet</td></tr>"}</table></div>`}
function officers(){if(!isOff)return `<div class="card">🔒 Officers only. Ask the club owner to give you Editor access.</div>`;
 const td=attn.filter(a=>a.date===today()),days={};attn.forEach(a=>{days[a.date]=(days[a.date]||0)+1});const dl=Object.keys(days).sort().reverse().slice(0,7);
 return `<div class="card"><div class="sec">📅 Attendance</div><p><b>${td.length}</b> checked in today${td.length?": "+td.map(a=>esc(a.name)).join(", "):""}</p>${dl.length?`<div class="mut">Recent: ${dl.map(d=>d.slice(5)+" ("+days[d]+")").join(" · ")}</div>`:""}</div>
 <div class="card"><div class="sec">➕ Add a puzzle</div><div class="mut">Paste a FEN. I find the solution automatically (mate in 1 or 2).</div><input id="pt" placeholder="Title"><input id="pf" placeholder="FEN position"><label class="mut" for="pl">Level (1 = Beginner … 6 = Master)</label><input id="pl" type="number" min="1" max="6" value="3"><button class="btn pri" style="margin-top:6px" onclick="addP()">Add puzzle</button></div>
 <div class="card"><div class="sec">➕ Add a task</div><input id="tt" placeholder="Task (e.g. Teach a friend the Italian Game)"><label class="mut" for="tx">XP reward</label><input id="tx" type="number" min="1" value="20"><button class="btn pri" style="margin-top:6px" onclick="addT()">Add task</button></div>
 ${custom.length||tasks.length?`<div class="card"><div class="sec">Manage</div>${custom.map(p=>`<div class="row"><span>🧩 ${esc(p.t)} <span class="mut">L${lvl(p)+1}</span></span><button class="btn sm ${armed==="dp"+p._id?"dng":""}" onclick="delDoc('puzzles',${q(p._id)})">${armed==="dp"+p._id?"Sure?":"Delete"}</button></div>`).join("")}${tasks.map(t=>`<div class="row"><span>🎯 ${esc(t.title)}</span><button class="btn sm ${armed==="dt"+t._id?"dng":""}" onclick="delDoc('tasks',${q(t._id)})">${armed==="dt"+t._id?"Sure?":"Delete"}</button></div>`).join("")}</div>`:""}
 <div class="card"><div class="sec">👥 Roster</div><div class="scroll"><table><tr><th>Name</th><th>Sessions</th><th>XP</th></tr>${players.map(p=>`<tr><td>${esc(p.avatar||"♞")} ${esc(p.name||"Member")}</td><td>${(p.checkins||[]).length}</td><td>${p.xp||0}</td></tr>`).join("")}</table></div></div>`}
function delDoc(col,id){arm((col==="puzzles"?"dp":"dt")+id,()=>{db&&db.doc(col+"/"+id).delete().catch(()=>toast("Could not delete"))})}
function addP(){const t=(pt.value||"").trim(),f=(pf.value||"").trim(),d=Math.min(6,Math.max(1,+pl.value||3))-1;
 if(!t||!f)return toast("Enter a title and a FEN");
 const fp=f.split(" ")[0];if(!/^([pnbrqkPNBRQK1-8]+\/){7}[pnbrqkPNBRQK1-8]+$/.test(fp))return toast("That FEN isn't valid");
 let s;try{s=parse(f)}catch(e){return toast("That FEN isn't valid")}
 if(s.b.length!==64)return toast("That FEN isn't valid");
 const nb=c=>s.b.filter(x=>x===c).length;if(nb("K")!==1||nb("k")!==1)return toast("Each side needs exactly one king");
 if(att(s.b,s.b.indexOf(s.t==="w"?"k":"K"),s.t))return toast("Illegal position: the side not to move is in check");
 if(!legal(s).length)return toast("That position has no legal moves");
 const n=mating(s).length?1:mate2(s).length?2:0;if(!n)return toast("No forced mate in 1 or 2 found in that position");
 if(!db)return toast("Not connected");
 db.collection("puzzles").add({t,f,d,n}).then(()=>{delete keep.pt;delete keep.pf;pt.value="";pf.value="";toast("Puzzle added (mate in "+n+")")}).catch(()=>toast("Could not save"))}
function addT(){const t=(tt.value||"").trim();if(!t)return toast("Enter a task");db&&db.collection("tasks").add({title:t,xp:Math.max(1,+tx.value||10)}).then(()=>{delete keep.tt;tt.value="";toast("Task added")}).catch(()=>toast("Could not save"))}
/* ---- shell ---- */
const TABS=[["puzzles","🧩","Puzzles"],["play","⚔️","Play"],["profile","👤","Profile"],["tasks","🎯","Tasks"],["board","🏆","Ranks"]];
function go(t){tab=t;G=null;sel=null;promo=null;armed="";render();scrollTo(0,0)}
function renderNav(){const T=TABS.concat(isOff?[["off","🔒","Officers"]]:[]),n=db&&hasP()?myTurnN()+reqs().length:0;
 nav.innerHTML=T.map(t=>`<button class="${tab===t[0]?"on":""}" onclick="go('${t[0]}')"><span class="ic">${t[1]}</span><span>${t[2]}</span>${t[0]==="play"&&n?`<b class="nb">${n}</b>`:""}</button>`).join("");
 const p=document.getElementById("pill");if(p)p.textContent=hasP()?(me.avatar||"♞")+" "+me.xp+" XP":"Guest"}
function render(){renderNav();const f={puzzles,play:playTab,profile,tasks:taskTab,board:board_,off:officers}[tab]||puzzles;
 app.innerHTML=f();fresh=false;for(const k in keep){if(k==="nm")continue;const e=document.getElementById(k);if(e&&e.value!==keep[k])e.value=keep[k]}}
function soft(){const a=document.activeElement;if(a&&a.tagName==="INPUT")return;render()}
function refresh(tabs){renderNav();if(tabs.includes(tab))soft()}
document.addEventListener("pointerdown",e=>{const d=e.target.closest&&e.target.closest("#board div[data-s]");if(d){try{tab==="play"?gclick(d.dataset.s):pclick(d.dataset.s)}catch(err){console.error(err);sel=null;render()}}});
document.addEventListener("input",e=>{const t=e.target;if(t&&t.id)keep[t.id]=t.value});
document.addEventListener("focusout",()=>setTimeout(()=>{if(!(document.activeElement&&document.activeElement.tagName==="INPUT"))soft()},250));
fix();render();init().catch(()=>{}).then(()=>{renderNav();soft()});

</script></body></html>
